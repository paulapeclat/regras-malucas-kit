name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas (Rokit)
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Formatação (StyLua)
        run: stylua --check src tests examples

      - name: Lint (Selene)
        run: selene src examples

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Luau
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q luau.zip

      - name: Testes do Cooldown
        run: ./luau tests/Cooldown.spec.luau
